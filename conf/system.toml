[system.runtime]
# Runtime 根目录，相对路径时相对于仓库根目录解析。
root = "runtime"
# 后端进程 PID 文件名，写入 runtime/system/ 目录下。
backend_pid_file = "backend.pid"
# 前端进程 PID 文件名，写入 runtime/system/ 目录下。
frontend_pid_file = "frontend.pid"
# 后端日志文件名，写入 runtime/system/ 目录下。
backend_log_file = "backend.log"
# 前端日志文件名，写入 runtime/system/ 目录下。
frontend_log_file = "frontend.log"

[system.healthcheck]
# 启动后健康检查的最大重试次数。
attempts = 30
# 每次健康检查之间的等待秒数。
interval_seconds = 1.0
# 单次健康检查请求的超时时间，单位秒。
timeout_seconds = 1.0

[system.shutdown]
# 优雅停止阶段最多等待多少轮。
grace_attempts = 10
# 每轮停止检查之间的等待秒数。
interval_seconds = 1.0

[service.backend]
# 后端服务监听地址。
host = "127.0.0.1"
# 后端服务监听端口。
port = 8000
# 是否开启 uvicorn 自动重载。
reload = false

[service.frontend]
# 前端服务监听地址。
host = "127.0.0.1"
# 前端服务监听端口。
port = 8501
# 是否开启 Flask debug 模式。
debug = false
# 前端访问后端的基础 URL；留空时自动拼接 backend 的 host 和 port。
backend_base_url = ""
# 前端发起 GET 请求时的超时时间，单位秒。
get_timeout_seconds = 10.0
# 前端发起 POST 请求时的超时时间，单位秒。
post_timeout_seconds = 30.0

[ui.dashboard]
# 用户页总榜最多展示多少条记录。
user_leaderboard_limit = 10
# 用户页每个赛道榜单最多展示多少条记录。
user_track_leaderboard_limit = 10
# 管理页最近批次区域最多展示多少条记录。
admin_recent_batches_limit = 8
# 管理页最近任务区域最多展示多少条记录。
admin_recent_tasks_limit = 8
# 管理页排行榜区域最多展示多少条记录。
admin_leaderboard_limit = 8

[ui.user_model_submission]
# 用户页模型提交表单默认的 Hugging Face 仓库 ID。
repo_id = "amazon/chronos-2"
# 用户页模型提交表单默认的展示名称。
name = "Amazon Chronos-2"
# 用户页模型提交表单默认的自定义模型 ID；空字符串表示默认自动生成。
model_id = ""
# 用户页模型提交表单默认的任务类型。
task = "chronos-2"
# 用户页模型提交表单默认的 revision。
revision = "main"
# 用户页模型提交表单默认的模型说明。
manual = "Amazon Chronos-2 baseline loaded from Hugging Face Transformers-compatible Chronos2Pipeline for benchmark evaluation."
# 文本生成类模型默认的 max_new_tokens。
max_new_tokens = 128
# 文本生成类模型默认的 temperature。
temperature = 0.0
# 文本生成类模型默认的 top_p。
top_p = 1.0
# Hugging Face 模型加载默认的 device_map。
device_map = "cpu"
# Hugging Face 模型加载默认的 torch_dtype。
torch_dtype = "float32"
# Hugging Face 模型加载默认的注意力实现；空字符串表示不传该参数。
attn_implementation = ""
# Chronos-2 或批量推理默认的 batch_size。
batch_size = 8
# 模型默认上下文长度；用于表单预填，实际可为空或按请求覆盖。
context_length = 512
# Chronos-2 默认的 max_output_patches；0 表示表单默认留空。
max_output_patches = 0
# 模型加载失败后的默认重试次数。
load_retries = 3
# 模型加载失败后每轮退避的基础秒数。
load_retry_backoff_seconds = 1.0
# 文本生成类模型默认是否开启采样。
do_sample = false
# 默认是否允许 trust_remote_code。
trust_remote_code = true
# 默认是否启用协变量输入。
use_covariates = true
# 默认是否启用跨序列联合预测。
cross_learning = false
# 用户页展示的推荐配置说明文本。
recommended_profile_label = "amazon/chronos-2 / cpu / float32 / batch=8"

[ui.admin_batch_generation]
# 管理页批次生成表单默认赛道。
track = "forecast_accuracy"
# 管理页批次生成表单默认样本数。
sample_count = 8
# 管理页批次生成表单默认上下文长度。
context_length = 96
# 管理页批次生成表单默认预测步长。
horizon = 24
# 管理页批次生成表单默认随机种子。
seed = 17
# 管理页批次生成表单允许填写的最小样本数。
min_sample_count = 4
# 管理页批次生成表单允许填写的最小上下文长度。
min_context_length = 24
# 管理页批次生成表单允许填写的最小预测步长。
min_horizon = 8

[benchmark.tracks.forecast_accuracy]
# 赛道展示名称。
name = "Forecast Accuracy"
# 赛道说明文本。
description = "标准零样本预测赛道，主要考察趋势、周期和多尺度外推能力。"
# 赛道使用的公平性策略标识。
fairness_policy = "monthly_replay"
# 赛道默认上下文长度。
default_context_length = 96
# 赛道默认预测步长。
default_horizon = 24
# 赛道建议样本数。
suggested_sample_count = 12
# 赛道可调节的参数标签列表。
knobs = ["period_count", "trend_strength", "noise_level"]

[benchmark.tracks.covariate_robustness]
# 赛道展示名称。
name = "Covariate Robustness"
# 赛道说明文本。
description = "打乱协变量顺序并注入无关变量，评估模型抗协变量干扰能力。"
# 赛道使用的公平性策略标识。
fairness_policy = "monthly_replay_with_scoreboard_points"
# 赛道默认上下文长度。
default_context_length = 96
# 赛道默认预测步长。
default_horizon = 24
# 赛道建议样本数。
suggested_sample_count = 12
# 赛道可调节的参数标签列表。
knobs = ["covariate_count", "distractor_ratio", "order_shuffle"]

[benchmark.tracks.noise_robustness]
# 赛道展示名称。
name = "Noise Robustness"
# 赛道说明文本。
description = "在输入序列上增加噪声和相位漂移，评估模型抗噪能力。"
# 赛道使用的公平性策略标识。
fairness_policy = "monthly_replay_with_std"
# 赛道默认上下文长度。
default_context_length = 96
# 赛道默认预测步长。
default_horizon = 24
# 赛道建议样本数。
suggested_sample_count = 12
# 赛道可调节的参数标签列表。
knobs = ["noise_level", "phase_shift", "amplitude_drift"]

[benchmark.tracks.cost_intensive]
# 赛道展示名称。
name = "Cost Intensive"
# 赛道说明文本。
description = "复杂长上下文任务，联合评估效果与延迟/Token 成本。"
# 赛道使用的公平性策略标识。
fairness_policy = "seasonal_points_ranking"
# 赛道默认上下文长度。
default_context_length = 192
# 赛道默认预测步长。
default_horizon = 48
# 赛道建议样本数。
suggested_sample_count = 8
# 赛道可调节的参数标签列表。
knobs = ["context_length", "horizon", "token_budget", "latency_budget"]

[[benchmark.builtin_models]]
# 内置模型的唯一 ID。
model_id = "seasonal-naive-stub"
# 内置模型展示名称。
name = "Seasonal Naive Stub"
# 内置模型适配器类型。
adapter = "seasonal_naive"
# 模型来源类型。
source_type = "builtin_stub"
# 模型说明文本。
manual = "重复历史中的主周期片段，适合做周期理解赛道基线。"
# 模型能力标签列表。
capabilities = ["forecast", "multi_period"]

[[benchmark.builtin_models]]
# 内置模型的唯一 ID。
model_id = "recent-mean-stub"
# 内置模型展示名称。
name = "Recent Mean Stub"
# 内置模型适配器类型。
adapter = "recent_mean"
# 模型来源类型。
source_type = "builtin_stub"
# 模型说明文本。
manual = "用近期窗口均值外推，作为简单平滑型基线。"
# 模型能力标签列表。
capabilities = ["forecast", "low_cost"]

[[benchmark.builtin_models]]
# 内置模型的唯一 ID。
model_id = "covariate-trap-stub"
# 内置模型展示名称。
name = "Covariate Trap Stub"
# 内置模型适配器类型。
adapter = "covariate_trap"
# 模型来源类型。
source_type = "builtin_stub"
# 模型说明文本。
manual = "故意依赖协变量顺序的桩模型，用于验证协变量赛道是否能识别脆弱行为。"
# 模型能力标签列表。
capabilities = ["covariate", "bad_case_generation"]

[benchmark.synthetic_generation]
# 自动生成数据集时最多尝试多少次，超过后视为失败。
max_generation_attempts = 5
# 在样本生成中启用相位偏移的概率。
phase_shift_probability = 0.45
# 当上下文长度不小于该阈值时，默认使用长周期集合。
context_length_period_threshold = 96
# 短上下文场景下默认使用的周期列表。
default_short_periods = [6, 12]
# 长上下文场景下默认使用的周期列表。
default_long_periods = [12, 24]
# 协变量鲁棒性赛道使用的周期列表。
covariate_robustness_periods = [6, 18]
# 抗噪赛道使用的周期列表。
noise_robustness_periods = [8, 24]
# 成本赛道使用的周期列表。
cost_intensive_periods = [12, 24, 48]
# 样本生成时可选的振幅模式列表。
amplitude_modes = ["stable", "slow_drift", "mid_spike"]
# 样本生成时可选的趋势类型列表。
trend_types = ["linear", "piecewise_linear", "smooth_curve"]
# 样本生成时可选的难度等级列表。
difficulties = ["easy", "medium", "hard"]
# 每个周期阶数对应的基础振幅系数。
amplitude_base = 0.8
# slow_drift 模式下振幅漂移强度。
slow_drift_strength = 0.3
# mid_spike 模式在中后段增加的振幅倍数。
mid_spike_multiplier = 1.3
# 相位偏移量，单位弧度。
phase_shift_radians = 0.6283185307179586
# helpful_covariate 相对主序列的缩放系数。
covariate_helpful_scale = 0.7
# helpful_covariate 噪声标准差的分母，值越大噪声越小。
covariate_helpful_noise_divisor = 2.0
# 协变量鲁棒性赛道生成多少条干扰协变量。
covariate_distractor_count = 3
# 干扰协变量可选的周期集合。
covariate_distractor_period_choices = [5, 9, 11]
# 干扰协变量的正弦振幅系数。
covariate_distractor_amplitude = 0.5
# 干扰协变量附加的高斯噪声标准差。
covariate_distractor_noise_std = 0.7
# 抗噪赛道中对历史序列额外放大的噪声倍数。
noise_history_multiplier = 1.8
# noise_probe 协变量的高斯噪声标准差。
noise_probe_std = 1.0
# calendar_signal 协变量的周期长度。
calendar_signal_period = 24
# load_signal 协变量中的线性趋势缩放系数。
load_signal_trend_scale = 0.2
# 线性趋势的终点斜率系数。
trend_linear_scale = 4.0
# 分段线性趋势第一段结束的比例位置。
trend_piecewise_first_ratio = 0.4
# 分段线性趋势第一段的斜率。
trend_piecewise_first_slope = 2.5
# 分段线性趋势第二段结束的比例位置。
trend_piecewise_second_ratio = 0.75
# 分段线性趋势第二段的基础偏置。
trend_piecewise_second_base = 1.0
# 分段线性趋势第二段的斜率。
trend_piecewise_second_slope = 4.0
# 分段线性趋势第三段的基础偏置。
trend_piecewise_third_base = 2.4
# 分段线性趋势第三段的斜率。
trend_piecewise_third_slope = 1.5
# 平滑曲线趋势的基础偏置。
trend_smooth_base = 0.6
# 平滑曲线趋势的线性增长系数。
trend_smooth_slope = 2.0
# 平滑曲线趋势中叠加的正弦波幅度。
trend_smooth_wave = 0.5

[benchmark.synthetic_generation.noise_base_levels]
# forecast_accuracy 赛道的基础噪声水平。
forecast_accuracy = 0.18
# covariate_robustness 赛道的基础噪声水平。
covariate_robustness = 0.2
# noise_robustness 赛道的基础噪声水平。
noise_robustness = 0.35
# cost_intensive 赛道的基础噪声水平。
cost_intensive = 0.22

[benchmark.synthetic_generation.difficulty_factors]
# easy 难度对基础噪声的缩放系数。
easy = 0.8
# medium 难度对基础噪声的缩放系数。
medium = 1.0
# hard 难度对基础噪声的缩放系数。
hard = 1.3

[benchmark.huggingface]
# 文本生成类预测时，从历史序列末尾截取多少个点构造 prompt。
text_generation_history_limit = 48
# 文本生成类预测时，最多向 prompt 中写入多少个协变量。
text_generation_covariate_limit = 3
# 每个协变量在 prompt 中最多截取多少个最近值。
text_generation_covariate_value_limit = 48

[benchmark.scoring]
# 内置打分中 token 估算的基础常数项。
base_tokens = 90
# 历史序列长度折算 token 时使用的除数。
history_token_divisor = 2
# 每条协变量额外折算的 token 数。
covariate_token_weight = 24
# 每个预测步长额外折算的 token 数。
token_per_horizon = 3
# 成本赛道对延迟的放大倍数。
cost_track_latency_multiplier = 1.8
# 成本赛道额外增加的 token 惩罚项。
cost_track_token_bonus = 150
# 抗噪赛道对延迟的放大倍数。
noise_track_latency_multiplier = 1.2
# 综合分公式中的基准分子。
composite_base = 100.0
# 综合分公式中 MSE 分母的偏移量。
composite_mse_offset = 1.0
# 综合分中延迟惩罚系数。
composite_latency_penalty = 0.35
# 综合分中 token 惩罚系数。
composite_token_penalty = 0.01

[benchmark.stub_models.seasonal_naive]
# seasonal_naive 内置模型的基础延迟，单位毫秒。
latency_base = 4.5
# seasonal_naive 每个预测步长增加的延迟，单位毫秒。
latency_per_horizon = 0.12
# seasonal_naive 每条协变量增加的延迟，单位毫秒。
latency_per_covariate = 0.2

[benchmark.stub_models.recent_mean]
# recent_mean 内置模型取平均时使用的回看窗口长度。
window = 8
# recent_mean 内置模型的基础延迟，单位毫秒。
latency_base = 2.0
# recent_mean 每个预测步长增加的延迟，单位毫秒。
latency_per_horizon = 0.08

[benchmark.stub_models.covariate_trap]
# covariate_trap 内置模型的基础延迟，单位毫秒。
latency_base = 5.5
# covariate_trap 每个预测步长增加的延迟，单位毫秒。
latency_per_horizon = 0.16
# covariate_trap 每条协变量增加的延迟，单位毫秒。
latency_per_covariate = 0.6

[benchmark.reporting]
# 报告中最多保留多少条 bad case。
bad_case_count = 3
# 当 MSE 低于该阈值时，在报告中标记为优势。
strength_mse_threshold = 2.2
# 当平均延迟低于该阈值时，在报告中标记为优势。
strength_latency_ms_threshold = 10.0
# 当平均 token 数高于该阈值时，在报告中标记为风险。
risk_token_threshold = 220

[benchmark.leaderboards]
# 赛道榜中同一模型有多次任务结果时，如何聚合出代表成绩。
track_aggregation_strategy = "best_composite_score"
# 总榜如何基于各赛道榜单进行聚合排序。
overall_ranking_strategy = "rank_sum"
# 某模型缺失某赛道成绩时，如何给该赛道补惩罚名次；max_plus_one 表示记为该赛道榜单长度 + 1。
missing_track_rank_penalty = "max_plus_one"

[data_inference]
# 根据差分和判断线性趋势时使用的每步阈值。
trend_linear_threshold_per_step = 0.05
# 幅度超过该值时推断为 medium 或以上难度。
difficulty_medium_amplitude = 3.0
# 幅度超过该值时推断为 hard 难度。
difficulty_hard_amplitude = 6.0
# 成本赛道推断动态周期时允许的最小周期下界。
cost_period_floor = 48
# 成本赛道推断动态周期时允许的最大周期上界。
cost_period_cap = 96
# 直接认定为未来已知协变量的精确列名列表。
future_known_covariates_exact = ["helpful_covariate"]
# 认定为未来已知协变量的列名前缀列表。
future_known_covariates_prefixes = ["calendar_", "load_"]

[validation]
# 历史序列极差低于该值时，判定为低方差序列。
low_variance_min_range = 0.3
