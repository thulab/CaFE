[project]
name = "tsbenchmark-dynamic"
version = "0.1.0"
description = "Dynamic benchmark system for time-series forecasting evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "flask",
  "pydantic",
  "requests",
  "uvicorn",
]

[project.optional-dependencies]
huggingface = [
  "chronos-forecasting>=1.5.0",
  "transformers",
  "torch",
]

[tool.setuptools]
packages = [
  "backend",
  "backend.app",
  "backend.app.domain",
  "backend.app.data_management",
  "backend.app.data_management.data_loader",
  "backend.app.data_management.processors",
  "backend.app.data_management.validators",
  "backend.app.model_management",
  "backend.app.task_management",
  "backend.app.leaderboard_management",
  "frontend",
]
