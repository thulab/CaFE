[project]
name = "tsbenchmark-dynamic"
version = "0.1.0"
description = "Dynamic benchmark system for time-series forecasting evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "flask",
  "pydantic",
  "requests",
  "uvicorn",
]

[project.optional-dependencies]
huggingface = [
  "chronos-forecasting>=1.5.0",
  "transformers",
  "torch",
]

[tool.setuptools]
packages = ["backend", "backend.app", "backend.app.dataloaders", "backend.app.data_processors", "backend.app.data_validators", "frontend"]
