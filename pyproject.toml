[project]
name = "tsbenchmark-dynamic"
version = "0.1.0"
description = "Dynamic benchmark system for time-series forecasting evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "flask",
  "pydantic",
  "requests",
  "uvicorn",
]

[project.optional-dependencies]
test = [
  "httpx",
]
huggingface = [
  "chronos-forecasting>=2.0",
  "transformers",
  "torch",
]

[tool.setuptools]
packages = [
  "backend",
  "backend.app",
  "backend.app.domain",
  "backend.app.datasets",
  "backend.app.datasets.data_loader",
  "backend.app.datasets.processors",
  "backend.app.datasets.validators",
  "backend.app.models",
  "backend.app.tasks",
  "backend.app.leaderboards",
  "frontend",
]
