[project]
name = "cafe-benchmark"
version = "1.0.0"
description = "CaFE: Capability-Focused Extension for time-series foundation models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "msgpack>=1.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
test = ["pytest>=8.0"]

[project.scripts]
cafe = "cafe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cafe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
