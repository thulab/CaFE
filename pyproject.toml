[project]
name = "cafe-benchmark"
version = "2.0.0"
description = "CaFE: Capability-Focused Extension for time-series foundation models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "msgpack>=1.1",
    "numpy>=2.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8", "pandas>=2.0", "scipy>=1.12"]
test = ["pytest>=8.0"]
fev = ["fev==0.8.0", "socksio>=1.0.0"]
inference = [
    "torch>=2.10.0,<2.11.0",
    "transformers>=5.7.0,<5.8.0",
    "tokenizers>=0.22.0,<=0.23.0",
    "huggingface-hub>=1.5.0,<2.0",
    "safetensors>=0.6.2,<1.0",
    "einops>=0.8.1,<0.9",
    "scipy>=1.12,<2",
    "accelerate>=1.10.1,<2",
    "peft>=0.17,<1",
    "jaxtyping>=0.2.24",
    "pyyaml>=6.0",
    "dynaconf>=3.2.11,<4",
    "pydantic>=2.5",
    "pydantic-settings>=2.14,<3",
    "tzlocal>=5.3,<6",
    "xlstm>=2.0.3,<3; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "flashrnn>=1.0.4,<2; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "chronos-forecasting>=2.2,<3",
    "timesfm[torch]>=3,<4",
    "toto-2==2.0.0; python_version >= '3.12'",
]

[project.scripts]
cafe = "cafe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cafe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
