[project]
name = "tsbenchmark-dynamic"
version = "0.1.0"
description = "Dynamic benchmark system for time-series forecasting evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "flask",
  "pydantic",
  "requests",
  "uvicorn",
]

[project.optional-dependencies]
test = [
  "httpx",
]
huggingface = [
  "chronos-forecasting>=2.0",
  "transformers",
  "torch",
]
benchmark_v1 = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "typer>=0.12",
]

[tool.setuptools]
packages = [
  "backend",
  "backend.app",
  "backend.app.domain",
  "backend.app.datasets",
  "backend.app.datasets.data_loader",
  "backend.app.datasets.processors",
  "backend.app.datasets.validators",
  "backend.app.datasets.benchmark_v1",
  "backend.app.models",
  "backend.app.tasks",
  "backend.app.leaderboards",
  "frontend",
]
