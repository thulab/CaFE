<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TSBenchmark{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='user.css') }}">
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <section class="hero-copy">
          <p class="eyebrow">Public Portal</p>
          <h1>{% block hero_title %}{% endblock %}</h1>
          <p>{% block hero_description %}{% endblock %}</p>
          <nav class="view-switch">
            <a href="{{ url_for('user_home') }}" class="{{ 'active' if current_view == 'user' else '' }}">榜单</a>
            <a href="{{ url_for('submit_model_page') }}" class="{{ 'active' if current_view == 'submit_model' else '' }}">上传模型</a>
          </nav>
        </section>
        {% block hero_side %}{% endblock %}
      </header>

      {% if message %}
      <section class="banner">{{ message }}</section>
      {% endif %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
