[project]
name = "tsbenchmark-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=4.2.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "numpy>=2.4",
    "pandas>=3.0",
    "pyarrow>=23",
    "pyjwt>=2.10.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.24",
    "tsfile==2.3.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
