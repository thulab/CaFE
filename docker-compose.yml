# TSBenchmark Docker deployment.
#
# Default path assumes timer-rest-service is already running somewhere reachable.
# Configure TSBENCHMARK_TIMER_SERVICE_BASE_URL in .env, for example:
#   http://timer-service:10810              # same Docker network
#   http://host.docker.internal:10810       # service published on the host
#
# Optional local smoke-test stub:
#   TSBENCHMARK_TIMER_SERVICE_BASE_URL=http://stub:10810 docker compose --profile stub up --build

x-backend-image: &backend-image
  build:
    context: .
    dockerfile: backend/Dockerfile
    network: host
    extra_hosts:
      - "mirrors.aliyun.com:103.151.149.20"
  image: tsbenchmark-backend:latest

services:
  backend:
    <<: *backend-image
    container_name: tsbenchmark-backend
    environment:
      TSBENCHMARK_RUNTIME_DIR: /var/lib/tsbenchmark
      TSBENCHMARK_DATABASE_URL: sqlite:////var/lib/tsbenchmark/tsbenchmark.db
      TSBENCHMARK_AUTH_SECRET: ${TSBENCHMARK_AUTH_SECRET:?Set TSBENCHMARK_AUTH_SECRET in .env}
      TSBENCHMARK_ADMIN_PASSWORD: ${TSBENCHMARK_ADMIN_PASSWORD:?Set TSBENCHMARK_ADMIN_PASSWORD in .env}
      TSBENCHMARK_MODEL_ADAPTER: ${TSBENCHMARK_MODEL_ADAPTER:-rest}
      TSBENCHMARK_MODEL_LIFECYCLE_MODE: ${TSBENCHMARK_MODEL_LIFECYCLE_MODE:-sequential_unload}
      TSBENCHMARK_TIMER_SERVICE_BASE_URL: ${TSBENCHMARK_TIMER_SERVICE_BASE_URL:-http://host.docker.internal:10810}
      TSBENCHMARK_TIMER_SERVICE_API_PREFIX: ${TSBENCHMARK_TIMER_SERVICE_API_PREFIX:-/ai/api/v1}
      TSBENCHMARK_TIMER_SERVICE_MODEL_LOAD_TIMEOUT_SECONDS: ${TSBENCHMARK_TIMER_SERVICE_MODEL_LOAD_TIMEOUT_SECONDS:-600}
      TSBENCHMARK_SAMPLE_FORECAST_TIMEOUT_SECONDS: ${TSBENCHMARK_SAMPLE_FORECAST_TIMEOUT_SECONDS:-300}
    volumes:
      - tsbenchmark-runtime:/var/lib/tsbenchmark
    ports:
      - "${TSBENCHMARK_BACKEND_PUBLISHED_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      network: host
    image: tsbenchmark-frontend:latest
    container_name: tsbenchmark-frontend
    ports:
      - "${TSBENCHMARK_FRONTEND_PUBLISHED_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

  stub:
    <<: *backend-image
    container_name: tsbenchmark-stub
    command: ["uvicorn", "stub_service.main:app", "--host", "0.0.0.0", "--port", "10810"]
    profiles:
      - stub
    expose:
      - "10810"
    restart: unless-stopped

volumes:
  tsbenchmark-runtime:
